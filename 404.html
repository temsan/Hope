<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <title>Надежда Жди</title>
    <script>
        // Старые адреса (gallery.html, gallery_1.html…) ведут на главную. На github.io сайт проекта живёт
        // в подпапке /<репозиторий>/ — туда и возвращаем.
        location.replace(location.hostname.endsWith('github.io') ? '/' + location.pathname.split('/')[1] + '/' : '/');
    </script>
</head>

</html>
