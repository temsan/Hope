    <!-- Дождь за окном (тонкие линии, дальний план) -->
    <canvas id="rainBgCanvas" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none;"></canvas>
    <script>
    // Дождь за окном: тонкие падающие линии-частицы (Canvas 2D, плавно, без мелькания).
    function __startRainBg(){
      if (window.__rainBgRunning) return;
      const cv = document.getElementById('rainBgCanvas');
      const ctx = cv.getContext('2d');
      if (!ctx){ return; }
      window.__rainBgRunning = true;
      const DPR = Math.min(window.devicePixelRatio || 1, 2);
      const rnd = (a,b) => a + (b-a)*Math.random();
      let W, H, lines = [];

      function makeLine(){
        // три плана глубины: дальний тоньше/бледнее/медленнее
        const depth = Math.random();              // 0 дальний … 1 ближний
        const len   = rnd(14, 40) * (0.5 + depth); // длина штриха
        return {
          x: rnd(-40, W+40),
          y: rnd(-H, 0),
          len,
          vy: rnd(7, 12) * (0.5 + depth),          // скорость падения
          slant: rnd(0.12, 0.22),                  // наклон (ветер)
          w: 0.6 + depth*0.9,                       // толщина
          a: 0.06 + depth*0.16                      // прозрачность
        };
      }

      function resize(){
        W = window.innerWidth; H = window.innerHeight;
        cv.width = W*DPR; cv.height = H*DPR;
        ctx.setTransform(DPR,0,0,DPR,0,0);
        const count = Math.round(W / 14);           // плотность дождя
        lines = []; for (let i=0;i<count;i++){ const l=makeLine(); l.y=rnd(0,H); lines.push(l); }
      }

      function step(){
        if (window.__sceneryPaused){ requestAnimationFrame(step); return; }  // под пролётом не виден
        ctx.clearRect(0,0,W,H);
        ctx.lineCap = 'round';
        for (let i=0;i<lines.length;i++){
          const l = lines[i];
          l.y += l.vy;
          l.x += l.vy * l.slant;
          ctx.beginPath();
          ctx.moveTo(l.x, l.y);
          ctx.lineTo(l.x - l.len*l.slant, l.y - l.len);  // штрих вдоль направления падения
          ctx.lineWidth = l.w;
          ctx.strokeStyle = 'rgba(180,205,255,'+l.a+')';
          ctx.stroke();
          if (l.y - l.len > H + 10){                 // ушла за низ — респавн сверху
            Object.assign(l, makeLine());
            l.y = rnd(-40, -5);
          }
        }
        requestAnimationFrame(step);
      }
      window.addEventListener('resize', resize);
      resize();
      requestAnimationFrame(step);
    }

    // Определяем уровень производительности устройства:
    // 0 = слабый телефон (дождь отключён), 1 = телефон или планшет, 2 = десктоп или ноутбук.
    function __perfTier(){
      const touch = window.matchMedia('(pointer: coarse)').matches;
      const mem = navigator.deviceMemory || 4;          // GB, Chrome-only (Safari → 4)
      const cores = navigator.hardwareConcurrency || 4;
      const dpr = window.devicePixelRatio || 1;
      // Совсем слабый: touch + мало памяти или мало ядер
      if (touch && (mem <= 2 || cores <= 2)) return 0;
      // Средний: touch-устройство (смартфон/планшет)
      if (touch) return 1;
      // Мощный: десктоп / ноут
      return 2;
    }

    // Запуск после полной загрузки — не блокирует первичный рендер
    function __startAll(){
      const tier = __perfTier();
      if (tier === 0) return; // слабый телефон — без дождя
      requestAnimationFrame(__startRainBg);
    }
    if (document.readyState === 'complete') {
      __startAll();
    } else {
      window.addEventListener('load', __startAll);
    }
    </script>

    <script>
        function initApp(imagesData) {
        let currentIndex = 0;

        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modalImg');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const thumbnailsTrack = document.getElementById('thumbnailsTrack');
        const thumbnailsScroll = document.querySelector('.thumbnails-scroll');



        let thumbDragStartX = 0;
        let thumbDragDeltaX = 0;
        let isThumbDragging = false;
        let modalSwipeStartX = 0;
        let modalSwipeStartY = 0;
        let ignoreModalSwipe = false;
        const SWIPE_THRESHOLD = 60;
        const CAROUSEL_WHEEL_THRESHOLD = 18;
        const CAROUSEL_NAV_COOLDOWN_MS = 240;
        let lastCarouselNavAt = 0;
        const ZOOM_STEP = 0.18;
        const MAX_ZOOM_CAP = 16;
        let modalZoomLevel = 1;
        let modalMaxZoom = 1;
        let modalPanX = 0;
        let modalPanY = 0;
        let modalPanMaxX = 0;
        let modalPanMaxY = 0;
        let isModalPanning = false;
        let modalPanMoved = false;
        let modalPanPointerId = null;
        let modalPanStartX = 0;
        let modalPanStartY = 0;
        let modalPanOriginX = 0;
        let modalPanOriginY = 0;

        function updateModalPanLimits() {
            if (!modalImg.clientWidth || !modalImg.clientHeight) {
                modalPanMaxX = 0;
                modalPanMaxY = 0;
                return;
            }

            modalPanMaxX = Math.max(0, (modalImg.clientWidth * modalZoomLevel - modalImg.clientWidth) / 2);
            modalPanMaxY = Math.max(0, (modalImg.clientHeight * modalZoomLevel - modalImg.clientHeight) / 2);
        }

        function clampModalPan() {
            updateModalPanLimits();
            modalPanX = Math.max(-modalPanMaxX, Math.min(modalPanMaxX, modalPanX));
            modalPanY = Math.max(-modalPanMaxY, Math.min(modalPanMaxY, modalPanY));
        }

        function stopModalPanTracking() {
            isModalPanning = false;
            modalPanPointerId = null;
            modalImg.classList.remove('panning');
        }

        function applyModalZoom() {
            clampModalPan();
            modalImg.style.setProperty('--modal-zoom', modalZoomLevel.toFixed(4));
            modalImg.style.setProperty('--modal-pan-x', `${modalPanX.toFixed(2)}px`);
            modalImg.style.setProperty('--modal-pan-y', `${modalPanY.toFixed(2)}px`);
            const isZoomed = modalZoomLevel > 1.01;
            modalImg.classList.toggle('zoomed', isZoomed);
            if (!isZoomed) {
                stopModalPanTracking();
            }
        }

        function resetModalZoom() {
            modalZoomLevel = 1;
            modalMaxZoom = 1;
            modalPanX = 0;
            modalPanY = 0;
            modalPanMoved = false;
            stopModalPanTracking();
            applyModalZoom();
        }

        function recalculateModalMaxZoom() {
            if (!modalImg.naturalWidth || !modalImg.clientWidth || !modalImg.clientHeight) return;
            const ratioW = modalImg.naturalWidth / modalImg.clientWidth;
            const ratioH = modalImg.naturalHeight / modalImg.clientHeight;
            modalMaxZoom = Math.max(1, Math.min(MAX_ZOOM_CAP, Math.max(ratioW, ratioH)));
            if (modalZoomLevel > modalMaxZoom) {
                modalZoomLevel = modalMaxZoom;
            }
            applyModalZoom();
        }

        function zoomModalIn() {
            if (!modal.classList.contains('open')) return;
            recalculateModalMaxZoom();
            if (modalMaxZoom <= 1.01) return;

            const nextZoom = modalZoomLevel * (1 + ZOOM_STEP);
            modalZoomLevel = Math.max(1, Math.min(modalMaxZoom, nextZoom));
            applyModalZoom();
        }

        function showPrevImage() {
            showImage((currentIndex - 1 + imagesData.length) % imagesData.length);
        }

        function showNextImage() {
            showImage((currentIndex + 1) % imagesData.length);
        }

        function navigateCarouselByDelta(delta, evenZoomed = false) {
            if (!modal.classList.contains('open')) return;
            if (modalZoomLevel > 1.01 && !evenZoomed) return;
            if (Math.abs(delta) < CAROUSEL_WHEEL_THRESHOLD) return;

            const now = Date.now();
            if (now - lastCarouselNavAt < CAROUSEL_NAV_COOLDOWN_MS) return;
            lastCarouselNavAt = now;

            if (delta > 0) {
                showNextImage();
            } else {
                showPrevImage();
            }
        }

        function setupModalSwipeNavigation() {
            modal.addEventListener('touchstart', (e) => {
                if (!modal.classList.contains('open')) return;
                if (e.touches.length !== 1) { ignoreModalSwipe = true; return; }
                ignoreModalSwipe = modalZoomLevel > 1.01 || Boolean(e.target.closest('.nav-buttons, .close'));
                if (ignoreModalSwipe) return;
                modalSwipeStartX = e.touches[0].clientX;
                modalSwipeStartY = e.touches[0].clientY;
            }, { passive: true });

            modal.addEventListener('touchend', (e) => {
                if (!modal.classList.contains('open') || e.changedTouches.length !== 1 || ignoreModalSwipe) {
                    ignoreModalSwipe = false;
                    return;
                }

                const deltaX = e.changedTouches[0].clientX - modalSwipeStartX;
                const deltaY = e.changedTouches[0].clientY - modalSwipeStartY;
                ignoreModalSwipe = false;

                if (Math.abs(deltaX) < SWIPE_THRESHOLD || Math.abs(deltaX) < Math.abs(deltaY) * 1.2) {
                    return;
                }

                if (deltaX > 0) {
                    showPrevImage();
                } else {
                    showNextImage();
                }
            }, { passive: true });
        }

        // Колесо листает картины, когда пролёт долетел до галереи: над палитрой и вокруг картины (над самой картиной
        // приближает её); у первой и последней картины отпускает страницу.
        const journeyEnd = () => {
            const j = document.querySelector('.journey');
            return j.offsetTop + j.offsetHeight - innerHeight;
        };
        // Галерея на экране — когда влёт доигран (window.__inGallery ставит пролёт), а не когда страница
        // докручена: клип влёта ещё играет, а лишние щелчки колеса листали бы картины под ним.
        function isStageInView() {
            return scrollY >= journeyEnd() - 2 && window.__inGallery === true;
        }

        function setupModalWheelCarousel() {
            document.getElementById('flight').addEventListener('wheel', (e) => {
                if (Math.abs(e.deltaX) === 0 && Math.abs(e.deltaY) === 0) return;
                if (e.target === modalImg) return; // над картиной колесо приближает её (setupModalWheelZoom)
                const delta = Math.abs(e.deltaX) >= Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
                const atEdge = (delta < 0 && currentIndex === 0) || (delta > 0 && currentIndex === imagesData.length - 1);
                if (!isStageInView() || atEdge) return;

                e.preventDefault();
                // палитра листает всегда, даже когда картина приближена
                navigateCarouselByDelta(delta, Boolean(e.target.closest('#paletteWrap')));
            }, { passive: false });
        }

        function setupModalWheelZoom() {
            modalImg.addEventListener('load', () => {
                recalculateModalMaxZoom();
            });

            modalImg.addEventListener('wheel', (e) => {
                // над картиной колесо приближает её, как в прежней галерее; пока идёт пролёт — крутит страницу
                if (!modal.classList.contains('open') || !isStageInView()) return;
                e.preventDefault();
                e.stopPropagation();

                const isHorizontal = Math.abs(e.deltaX) > Math.abs(e.deltaY) * 1.15;
                if (isHorizontal) {
                    navigateCarouselByDelta(e.deltaX);
                    return;
                }

                recalculateModalMaxZoom();
                if (modalMaxZoom <= 1 && e.deltaY < 0) return;

                const zoomFactor = e.deltaY < 0 ? (1 + ZOOM_STEP) : (1 / (1 + ZOOM_STEP));
                const nextZoom = modalZoomLevel * zoomFactor;
                modalZoomLevel = Math.max(1, Math.min(modalMaxZoom, nextZoom));
                applyModalZoom();
            }, { passive: false });
        }

        function setupModalPanInteractions() {
            modalImg.addEventListener('pointerdown', (e) => {
                if (!modal.classList.contains('open')) return;
                if (modalZoomLevel <= 1.01) return;
                if (e.pointerType === 'mouse' && e.button !== 0) return;

                isModalPanning = true;
                modalPanMoved = false;
                modalPanPointerId = e.pointerId;
                modalPanStartX = e.clientX;
                modalPanStartY = e.clientY;
                modalPanOriginX = modalPanX;
                modalPanOriginY = modalPanY;
                modalImg.classList.add('panning');

                if (modalImg.setPointerCapture) {
                    modalImg.setPointerCapture(e.pointerId);
                }

                e.preventDefault();
                e.stopPropagation();
            });

            modalImg.addEventListener('pointermove', (e) => {
                if (!isModalPanning || e.pointerId !== modalPanPointerId) return;

                const deltaX = e.clientX - modalPanStartX;
                const deltaY = e.clientY - modalPanStartY;
                if (Math.abs(deltaX) > 2 || Math.abs(deltaY) > 2) {
                    modalPanMoved = true;
                }

                modalPanX = modalPanOriginX + deltaX;
                modalPanY = modalPanOriginY + deltaY;
                applyModalZoom();

                e.preventDefault();
                e.stopPropagation();
            });

            const finishPan = (e) => {
                if (e && modalPanPointerId !== null && e.pointerId !== modalPanPointerId) return;
                if (!isModalPanning && modalPanPointerId === null) return;

                if (e && modalImg.releasePointerCapture && modalImg.hasPointerCapture && modalImg.hasPointerCapture(e.pointerId)) {
                    modalImg.releasePointerCapture(e.pointerId);
                }

                stopModalPanTracking();
            };

            modalImg.addEventListener('pointerup', finishPan);
            modalImg.addEventListener('pointercancel', finishPan);
            modalImg.addEventListener('lostpointercapture', finishPan);
        }

        // Pinch-to-zoom для мобильных устройств
        function setupModalPinchZoom() {
            let initialPinchDistance = 0;
            let initialZoomLevel = 1;
            let isPinching = false;

            modalImg.addEventListener('touchstart', (e) => {
                if (!modal.classList.contains('open')) return;
                if (e.touches.length === 2) {
                    // Начало pinch жеста двумя пальцами
                    isPinching = true;
                    initialPinchDistance = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    initialZoomLevel = modalZoomLevel;
                    recalculateModalMaxZoom();
                }
            }, { passive: true });

            modalImg.addEventListener('touchmove', (e) => {
                if (!isPinching || e.touches.length !== 2) return;
                e.preventDefault();

                const currentDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );

                if (initialPinchDistance > 0) {
                    const pinchRatio = currentDistance / initialPinchDistance;
                    const newZoom = initialZoomLevel * pinchRatio;
                    modalZoomLevel = Math.max(1, Math.min(modalMaxZoom, newZoom));
                    applyModalZoom();
                }
            }, { passive: false });

            const endPinch = () => {
                isPinching = false;
                initialPinchDistance = 0;
            };

            modalImg.addEventListener('touchend', endPinch);
            modalImg.addEventListener('touchcancel', endPinch);
        }
        setupModalSwipeNavigation();
        setupModalWheelCarousel();
        setupModalWheelZoom();
        setupModalPanInteractions();
        setupModalPinchZoom();

        // Show specific image in modal
        function showImage(index) {
            currentIndex = index;
            modalImg.classList.remove('loaded');
            resetModalZoom();

            // Update background color based on temperature
            const currentImage = imagesData[currentIndex];
            if (currentImage.temperature !== undefined) {
                const temp = Math.max(-0.3, Math.min(0.3, currentImage.temperature));
                const r = Math.round(20 + (temp + 0.3) / 0.6 * 80);
                const g = Math.round(40 + (0.3 - Math.abs(temp)) / 0.3 * 40);
                const b = Math.round(80 - (temp + 0.3) / 0.6 * 60);
                modal.style.setProperty('--modal-bg-color', `rgba(${r}, ${g}, ${b}, 0.9)`);
            }

            // Плавное открытие: сразу full если в кэше, иначе fade-in после загрузки
            const snapIndex = currentIndex;
            if (fullCache.has(snapIndex)) {
                modalImg.src = fullCache.get(snapIndex);
                modalImg.classList.add('loaded');
            } else {
                modalImg.src = imagesData[snapIndex].thumbnail;
                modalImg.classList.add('loaded');
                getFullSrc(snapIndex).then(src => {
                    if (currentIndex !== snapIndex) return;
                    const tmp = new Image();
                    tmp.onload = async () => {
                        await tmp.decode().catch(() => {});  // распакована заранее — подмена без рывка
                        if (currentIndex !== snapIndex) return;
                        modalImg.classList.remove('loaded');
                        requestAnimationFrame(() => {
                            modalImg.src = src;
                            requestAnimationFrame(() => modalImg.classList.add('loaded'));
                        });
                    };
                    tmp.src = src;
                });
            }

            // Прогрев соседей
            const n = imagesData.length;
            enqueuePreload((currentIndex + 1) % n);
            enqueuePreload((currentIndex - 1 + n) % n);

            // Update info and thumbnails
            markActiveThumb();
            requestAnimationFrame(recalculateModalMaxZoom);
        }

        // Generate thumbnails for modal
        // ── ПАЛИТРА: превьюшки как мазки краски по всей видимой стеклянной форме ──
        const BLOB_SPECS = [
            { w: 64, h: 50, rot: -11, shape: '72% 28% 56% 44% / 34% 66% 42% 58%' },
            { w: 56, h: 54, rot: -6, shape: '38% 62% 27% 73% / 63% 31% 69% 37%' },
            { w: 66, h: 46, rot: 8, shape: '68% 32% 60% 40% / 28% 72% 36% 64%' },
            { w: 54, h: 52, rot: -9, shape: '46% 54% 74% 26% / 58% 42% 26% 74%' },
            { w: 62, h: 48, rot: -3, shape: '31% 69% 42% 58% / 66% 34% 59% 41%' },
            { w: 58, h: 56, rot: 4, shape: '63% 37% 24% 76% / 48% 52% 70% 30%' },
            { w: 64, h: 48, rot: 9, shape: '52% 48% 67% 33% / 25% 75% 43% 57%' },
            { w: 56, h: 52, rot: -7, shape: '74% 26% 35% 65% / 41% 59% 71% 29%' },
            { w: 62, h: 56, rot: -1, shape: '28% 72% 58% 42% / 67% 33% 38% 62%' },
            { w: 64, h: 50, rot: 5, shape: '59% 41% 31% 69% / 72% 28% 47% 53%' },
            { w: 58, h: 48, rot: 11, shape: '43% 57% 71% 29% / 27% 73% 61% 39%' },
            { w: 66, h: 54, rot: -5, shape: '70% 30% 46% 54% / 57% 43% 29% 71%' },
        ];

        const PALETTE_VIEWBOX = { w: 300, h: 220 };

        function renderPaletteBubbles(items, bubbles) {
            items.forEach((item, i) => {
                const spec = BLOB_SPECS[i % BLOB_SPECS.length];
                const bubble = bubbles[i];
                item.style.width = bubble.w + 'px';
                item.style.height = bubble.h + 'px';
                item.style.left = Math.round(bubble.x - bubble.w / 2) + 'px';
                item.style.top = Math.round(bubble.y - bubble.h / 2) + 'px';
                item.style.borderRadius = spec.shape;
                item.style.setProperty('--blob-rotate', `${spec.rot}deg`);
            });
        }

        // Мазки на палитре — в единицах viewBox: зазор между ними и запас до края палитры и до отверстия.
        // Мазок под курсором крупнее (--blob-scale 1.06) — не внахлёст и тогда.
        const PALETTE_GAP = 4, PALETTE_EDGE = 6, BLOB_HOVER = 1.06;

        // Контур палитры (внешний край и отверстие) точками по кривым Безье пути #paletteBodyPath
        // и проверка «внутри палитры» через Path2D: отверстие — дырка (evenodd).
        let paletteGeo = null;
        function paletteGeometry() {
            if (paletteGeo) return paletteGeo;
            const d = document.getElementById('paletteBodyPath').getAttribute('d'), edge = [];
            let cur = [0, 0], start = [0, 0];
            for (const [, cmd, args] of d.matchAll(/([MCZ])([^MCZ]*)/g)) {
                const v = (args.match(/-?\d*\.?\d+/g) || []).map(Number);
                if (cmd === 'M') cur = start = [v[0], v[1]];
                for (let i = 0; cmd === 'C' && i + 5 < v.length; i += 6) {
                    const [x0, y0] = cur, [x1, y1, x2, y2, x, y] = v.slice(i, i + 6);
                    for (let k = 1; k <= 24; k++) {
                        const t = k / 24, u = 1 - t;
                        edge.push([u * u * u * x0 + 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t * x,
                            u * u * u * y0 + 3 * u * u * t * y1 + 3 * u * t * t * y2 + t * t * t * y]);
                    }
                    cur = [x, y];
                }
                if (cmd === 'Z') {
                    for (let k = 1; k <= 8; k++) edge.push([cur[0] + (start[0] - cur[0]) * k / 8, cur[1] + (start[1] - cur[1]) * k / 8]);
                    cur = start;
                }
            }
            const shape = new Path2D(d), ctx = document.createElement('canvas').getContext('2d');
            // расстояние до ближайшей точки контура и сама эта точка
            const nearestEdge = (x, y) => {
                let m = Infinity, e = edge[0];
                for (const q of edge) {
                    const dd = (x - q[0]) ** 2 + (y - q[1]) ** 2;
                    if (dd < m) { m = dd; e = q; }
                }
                return [Math.sqrt(m), e];
            };
            paletteGeo = { edge, nearestEdge, inside: (x, y) => ctx.isPointInPath(shape, x, y, 'evenodd') };
            return paletteGeo;
        }

        // Старт раскладки — count точек равномерно по палитре не ближе PALETTE_EDGE к краю: центроидная
        // диаграмма Вороного (итерации Ллойда) по сетке через 3 единицы; первая точка — каждая дальше всех от выбранных.
        function spreadSlots(count) {
            const { edge, nearestEdge, inside } = paletteGeometry();
            const xs = edge.map(q => q[0]), ys = edge.map(q => q[1]), pts = [];
            for (let y = Math.min(...ys) + 1.5; y < Math.max(...ys); y += 3) {
                for (let x = Math.min(...xs) + 1.5; x < Math.max(...xs); x += 3) {
                    if (inside(x, y) && nearestEdge(x, y)[0] >= PALETTE_EDGE) pts.push([x, y]);
                }
            }
            if (pts.length < count) return null;
            const d2 = (u, x, y) => (u[0] - x) ** 2 + (u[1] - y) ** 2;
            let mx = 0, my = 0;
            for (const q of pts) { mx += q[0] / pts.length; my += q[1] / pts.length; }
            const centers = [pts.reduce((best, q) => (d2(q, mx, my) < d2(best, mx, my) ? q : best))];
            const far = pts.map(q => d2(q, centers[0][0], centers[0][1]));
            while (centers.length < count) {
                let k = 0;
                for (let i = 1; i < pts.length; i++) if (far[i] > far[k]) k = i;
                centers.push(pts[k]);
                for (let i = 0; i < pts.length; i++) far[i] = Math.min(far[i], d2(pts[i], pts[k][0], pts[k][1]));
            }
            const owner = new Int32Array(pts.length);
            for (let it = 0; it < 30; it++) {
                const sx = new Float64Array(count), sy = new Float64Array(count), n = new Float64Array(count);
                pts.forEach((q, i) => {
                    let j = 0, bd = d2(q, centers[0][0], centers[0][1]);
                    for (let c = 1; c < count; c++) {
                        const dd = d2(q, centers[c][0], centers[c][1]);
                        if (dd < bd) { bd = dd; j = c; }
                    }
                    owner[i] = j; sx[j] += q[0]; sy[j] += q[1]; n[j]++;
                });
                // центр — к середине своей области; палитра вогнутая, поэтому к ближайшей точке этой же области:
                // области разных центров не пересекаются, и центры не слипаются
                const best = new Float64Array(count).fill(Infinity);
                pts.forEach((q, i) => {
                    const j = owner[i], dd = d2(q, sx[j] / n[j], sy[j] / n[j]);
                    if (dd < best[j]) { best[j] = dd; centers[j] = q; }
                });
            }
            return centers.map(q => [q[0], q[1]]);
        }

        // Упаковка мазков от стартовой раскладки: мазки растут, пока помещаются, — соседи раздвигаются
        // до зазора PALETTE_GAP, край палитры и отверстие выталкивают внутрь до запаса PALETTE_EDGE.
        // Возвращает раскладку с самыми крупными мазками; R — полудиаметр мазка с половиной зазора.
        function packSlots(start) {
            const { nearestEdge, inside } = paletteGeometry();
            const centers = start.map(c => c.slice()), margin = PALETTE_EDGE - PALETTE_GAP / 2;
            const fit = () => {
                let r = Infinity;
                centers.forEach((c, i) => {
                    r = Math.min(r, inside(c[0], c[1]) ? nearestEdge(c[0], c[1])[0] - margin : -Infinity);
                    for (let j = i + 1; j < centers.length; j++) r = Math.min(r, Math.hypot(c[0] - centers[j][0], c[1] - centers[j][1]) / 2);
                });
                return r;
            };
            let R = fit(), best = centers.map(c => c.slice());
            for (let it = 0; it < 160 && centers.length > 1; it++) {
                const target = Math.max(R, 1) * 1.03;
                for (let pass = 0; pass < 4; pass++) {
                    centers.forEach((a, i) => centers.slice(i + 1).forEach(b => {
                        const dx = b[0] - a[0], dy = b[1] - a[1], dist = Math.hypot(dx, dy) || 1e-6;
                        if (dist >= 2 * target) return;
                        const push = (2 * target - dist) / 2 / dist;
                        a[0] -= dx * push; a[1] -= dy * push; b[0] += dx * push; b[1] += dy * push;
                    }));
                    for (const c of centers) {
                        const [dist, e] = nearestEdge(c[0], c[1]), into = inside(c[0], c[1]);
                        if (into && dist >= target + margin) continue;
                        // от ближайшей точки края внутрь; вылетевший за край — обратно через край
                        const dir = into ? 1 : -1, nx = (c[0] - e[0]) * dir, ny = (c[1] - e[1]) * dir;
                        const len = Math.hypot(nx, ny) || 1e-6, move = target + margin - dist * dir;
                        c[0] += nx / len * move; c[1] += ny / len * move;
                    }
                }
                const r = fit();
                if (r > R) { R = r; best = centers.map(c => c.slice()); }
            }
            return { R, slots: best };
        }

        // Раскладка мазков: упаковка от равномерного старта и от него же со сдвигами — она находит ближайший
        // максимум, и из нескольких берётся раскладка с самыми крупными мазками. Обход слотов — от самого
        // левого к ближайшему: соседние по теплоте мазки лежат рядом.
        // В единицах viewBox раскладка от окна не зависит — считается один раз.
        let paletteSlotsCache = null;
        function buildPaletteSlots(count) {
            if (paletteSlotsCache && paletteSlotsCache.count === count) return paletteSlotsCache;
            const start = spreadSlots(count) || [];
            let seed = 7;
            const jitter = () => ((seed = seed * 16807 % 2147483647) / 2147483647 - .5) * 30;
            let packed = packSlots(start);
            for (let k = 0; k < 6; k++) {
                const next = packSlots(start.map(([x, y]) => [x + jitter(), y + jitter()]));
                if (next.R > packed.R) packed = next;
            }
            const best = packed.slots, R = packed.R;
            const rest = best.slice(), path = [];
            let cur = rest.reduce((l, q) => (q[0] < l[0] ? q : l), rest[0]);
            while (rest.length) {
                rest.splice(rest.indexOf(cur), 1);
                path.push(cur);
                const from = cur;
                cur = rest.reduce((n, q) => (Math.hypot(q[0] - from[0], q[1] - from[1]) < Math.hypot(n[0] - from[0], n[1] - from[1]) ? q : n), rest[0]);
            }
            paletteSlotsCache = { count, size: Math.max(0, 2 * R - PALETTE_GAP) / BLOB_HOVER, slots: path };
            return paletteSlotsCache;
        }

        function layoutPalette() {
            const items = thumbnailsTrack.querySelectorAll('.thumb-item');
            const n = items.length;
            if (!n) return;
            const layoutStart = performance.now();

            // Палитра нарисована в SVG без искажения: viewBox вписан в обёртку по центру, в одном масштабе k.
            const wrapW = paletteWrap.clientWidth || 1;
            const wrapH = paletteWrap.clientHeight || 1;
            const k = Math.min(wrapW / PALETTE_VIEWBOX.w, wrapH / PALETTE_VIEWBOX.h);
            const ox = (wrapW - PALETTE_VIEWBOX.w * k) / 2, oy = (wrapH - PALETTE_VIEWBOX.h * k) / 2;
            // мазки лежат в track внутри обёртки; пока обёртка проявляется, она масштабирована — делим на масштаб
            const trackRect = thumbnailsTrack.getBoundingClientRect();
            const wrapRect = paletteWrap.getBoundingClientRect();
            const z = wrapRect.width / wrapW || 1;
            const trackLeft = (trackRect.left - wrapRect.left) / z;
            const trackTop = (trackRect.top - wrapRect.top) / z;

            const { size, slots } = buildPaletteSlots(n);

            // от холодных к тёплым — по обходу слотов (соседи перетекают градиентом)
            const order = imagesData.map((_, i) => i)
                .sort((a, b) => (imagesData[a].temperature ?? 0) - (imagesData[b].temperature ?? 0));

            // формы и пропорции мазков — из BLOB_SPECS, самый крупный по большей стороне — ровно size
            const specMax = Math.max(...BLOB_SPECS.map(spec => Math.max(spec.w, spec.h)));
            const s = size / specMax * k;
            const bubbles = new Array(n);
            order.forEach((imgIdx, j) => {
                const [x, y] = slots[j % slots.length];
                const spec = BLOB_SPECS[imgIdx % BLOB_SPECS.length];
                bubbles[imgIdx] = {
                    w: Math.round(spec.w * s),
                    h: Math.round(spec.h * s),
                    x: ox + x * k - trackLeft,
                    y: oy + y * k - trackTop,
                };
            });

            window.__paletteProfile = {
                layoutMs: Math.round((performance.now() - layoutStart) * 10) / 10,
                mode: 'slots',
                count: n,
            };
            renderPaletteBubbles(items, bubbles);
        }

        function generateThumbnails(animate = false) {
            thumbnailsTrack.innerHTML = '';
            imagesData.forEach((img, idx) => {
                const thumb = document.createElement('div');
                thumb.className = 'thumb-item';
                thumb.dataset.index = idx;
                if (idx === currentIndex) thumb.classList.add('active');

                const thumbImg = document.createElement('img');
                thumbImg.src = img.thumbnail;
                thumbImg.loading = "lazy";
                thumbImg.draggable = false;
                thumb.appendChild(thumbImg);

                thumb.addEventListener('click', (e) => {
                    e.stopPropagation();
                    showImage(idx);
                });

                thumbnailsTrack.appendChild(thumb);
            });

            requestAnimationFrame(() => layoutPalette({ animate: false }));
        }

        // Generate stars
        function createStars() {
            const starsContainer = document.getElementById('stars');
            const starCount = 100;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 70 + '%';
                star.style.animationDelay = Math.random() * 4 + 's';
                star.style.opacity = Math.random() * 0.6 + 0.1;
                starsContainer.appendChild(star);
            }
        }

        // Звёзды и прогрев полных картин — один раз на загрузке
        function initGallery() {
            createStars();
            preloadFullImages();
        }

        // Кэш полных картин: index -> base64 data URL
        const fullCache = new Map();
        // Единственный источник full-данных — images-full.js (грузим один раз лениво)
        let fullDataPromise = null;
        function getFullData() {
            if (!fullDataPromise) {
                fullDataPromise = new Promise(resolve => {
                    if (window.imagesFullData) { resolve(window.imagesFullData); return; }
                    const s = document.createElement('script');
                    s.src = 'images-full.js';
                    s.onload = () => resolve(window.imagesFullData);
                    s.onerror = () => resolve(null);
                    document.head.appendChild(s);
                });
            }
            return fullDataPromise;
        }

        function getFullSrc(index) {
            if (fullCache.has(index)) return Promise.resolve(fullCache.get(index));
            return getFullData().then(data => {
                const src = (data && data[index]) || imagesData[index].thumbnail;
                fullCache.set(index, src);
                return src;
            });
        }

        function preloadFullImages() {
            // После загрузки thumbnails — начинаем тянуть full в фоне через idle
            (window.requestIdleCallback || setTimeout)(() => {
                getFullData().then(data => {
                    if (!data) return;
                    data.forEach((src, i) => { if (src) fullCache.set(i, src); });
                });
            }, { timeout: 3000 });
        }

        function enqueuePreload(index) {
            // Прогрев кэша для конкретного индекса
            getFullSrc(index);
        }

        const paletteWrap = document.getElementById('paletteWrap');

        function markActiveThumb() {
            document.querySelectorAll('.thumb-item').forEach((thumb, idx) => {
                thumb.classList.toggle('active', idx === currentIndex);
            });
            const g = window.paintingEdges && window.paintingEdges[currentIndex + 1];
            if (g) document.getElementById('stage').style.setProperty('--room-glow', g.m.join(' '));
        }
        modalImg.addEventListener('click', (e) => {
            e.stopPropagation();
            if (modalPanMoved) {
                modalPanMoved = false;
                return;
            }
            zoomModalIn();
        });

        prevBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            showPrevImage();
        });

        nextBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            showNextImage();
        });

        document.addEventListener('keydown', (e) => {
            if (!isStageInView()) return;
            if (e.key === 'ArrowLeft') showPrevImage();
            if (e.key === 'ArrowRight') showNextImage();
        });

        window.addEventListener('resize', () => {
            if (modal.classList.contains('open')) {
                requestAnimationFrame(recalculateModalMaxZoom);
                requestAnimationFrame(() => layoutPalette({ animate: false }));
            }
        });

        window.addEventListener('load', initGallery);

        // Млечный путь
        const mwImg = document.getElementById('milkyWayImg');
        if (mwImg) {
            if (mwImg.complete && mwImg.naturalWidth > 0) {
                mwImg.classList.add('loaded');
            } else {
                mwImg.addEventListener('load', () => {
                    mwImg.classList.add('loaded');
                    mwImg.decode().catch(() => {});  // распакована заранее, а не при входе в галерею
                });
                mwImg.addEventListener('error', () => {
                    document.getElementById('milkyWay').style.display = 'none';
                });
            }
        }

        // ── Fluid Art Canvas: вихри краски ──────────────────────────────
        (function () {
            const canvas = document.getElementById('fluidCanvas');
            const ctx = canvas.getContext('2d');

            // Пятна мягкие: в половинном разрешении на глаз не отличить, а заливать вчетверо меньше
            const SCALE = .5;
            let W, H;
            function resize() {
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = Math.ceil(W * SCALE);
                canvas.height = Math.ceil(H * SCALE);
                ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
            }
            resize();
            window.addEventListener('resize', resize);

            // Палитра fluid art — насыщенные краски
            const COLORS = [
                [106, 31, 168],   // фиолетовый
                [13, 138, 158],  // бирюзовый
                [200, 80, 10],   // янтарный
                [20, 64, 168],  // кобальт
                [168, 21, 80],   // малиновый
                [20, 140, 60],   // изумрудный
            ];

            // Вихревые "потоки" — spiraling blobs
            const NUM_BLOBS = 7;
            const blobs = [];

            for (let i = 0; i < NUM_BLOBS; i++) {
                const c = COLORS[i % COLORS.length];
                blobs.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3,
                    r: 150 + Math.random() * 220,
                    color: c,
                    angle: Math.random() * Math.PI * 2,
                    spin: (Math.random() - 0.5) * 0.003,
                    pulse: Math.random() * Math.PI * 2,
                    pulseS: 0.0008 + Math.random() * 0.001,
                });
            }

            function drawBlob(b) {
                const pf = 0.88 + 0.12 * Math.sin(b.pulse);
                const r = b.r * pf;

                // Вытянутое пятно с вращением
                ctx.save();
                ctx.translate(b.x, b.y);
                ctx.rotate(b.angle);

                const grd = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
                grd.addColorStop(0, `rgba(${b.color[0]},${b.color[1]},${b.color[2]},0.22)`);
                grd.addColorStop(0.4, `rgba(${b.color[0]},${b.color[1]},${b.color[2]},0.12)`);
                grd.addColorStop(1, `rgba(${b.color[0]},${b.color[1]},${b.color[2]},0)`);

                ctx.scale(1, 0.55);  // вытянуть в эллипс
                ctx.beginPath();
                ctx.arc(0, 0, r, 0, Math.PI * 2);
                ctx.fillStyle = grd;
                ctx.fill();
                ctx.restore();
            }

            // Пятна плывут медленно: 30 перерисовок в секунду на глаз не отличить от частоты экрана.
            // Шаг — по времени (как при 60 кадрах в секунду): скорость не зависит от частоты экрана.
            let last = 0;
            function tick(ts = 0) {
                // под пролётом не видны
                if (window.__sceneryPaused || ts - last < 32) { requestAnimationFrame(tick); return; }
                const k = last ? Math.min(4, (ts - last) / 16.7) : 1;
                last = ts;
                ctx.clearRect(0, 0, W, H);

                for (const b of blobs) {
                    b.x += b.vx * k;
                    b.y += b.vy * k;
                    b.angle += b.spin * k;
                    b.pulse += b.pulseS * k;

                    // Мягкий отскок от краёв
                    if (b.x < -b.r) b.x = W + b.r;
                    if (b.x > W + b.r) b.x = -b.r;
                    if (b.y < -b.r) b.y = H + b.r;
                    if (b.y > H + b.r) b.y = -b.r;

                    drawBlob(b);
                }

                requestAnimationFrame(tick);
            }

            tick();
        })();
        // Галерея открыта сразу: первая картина — та же, на которой кончается пролёт
        generateThumbnails(false);
        showImage(0);
        } // end initApp
    </script>
    <script src="images-thumbs.js"></script>
    <script>
        initApp(window.imagesThumbsData);
    </script>
    </div>
